# Run the test suite on every push/PR. Includes the golden cross-language check
# (tests/test_golden.py), which shells out to node to prove Travel Mode's JS core
# still matches the Python core — so drift between them fails CI, not the owner's
# phone. node is needed for that one test; setup-node guarantees it.
name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # CI pinned 3.11 while the Dockerfile shipped 3.13, so CI was not testing what
      # deploys. That is how a version-specific syntax error reaches production (or, as
      # actually happened, fails CI while working fine locally). Both, every time.
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
