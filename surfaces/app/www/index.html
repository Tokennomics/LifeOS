<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeOS</title>
  <meta name="theme-color" content="#0F1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> LifeOS</div>
    <div class="header-right">
      <button id="cmd-k-btn" class="pill" style="font-size:11px; padding:4px 10px; border-color:var(--spark)40;" title="Keyboard Shortcuts (Ctrl+K)">Ctrl+K ⚡</button>
      <span id="mode-badge" class="badge">…</span>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav>
    <button data-tab="today" class="tab active">Today</button>
    <button data-tab="capture" class="tab">Capture</button>
    <button data-tab="people" class="tab">People</button>
    <button data-tab="map" class="tab">Map</button>
    <button data-tab="graph" class="tab">Graph</button>
    <button data-tab="more" class="tab">More</button>
  </nav>

  <dialog id="settings">
    <h2>Settings</h2>
    <label>Gateway URL <small>(empty = this server)</small>
      <input id="set-base" placeholder="http://nucbox:8787" autocapitalize="off">
    </label>
    <label>Bearer token <small>(only if the gateway sets one)</small>
      <input id="set-token" placeholder="optional" autocapitalize="off">
    </label>
    <div class="row">
      <button id="set-save" class="primary">Save</button>
      <button id="set-export">Export my graph</button>
      <button id="set-close">Close</button>
    </div>
    <p class="hint">Your data lives on your own gateway. Export is always available — the graph is yours.</p>
  </dialog>

  <dialog id="cmd-palette" style="background:var(--surface-1); border:1px solid var(--spark); border-radius:16px; padding:20px; max-width:480px; width:90%; color:var(--text);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="margin:0; font-size:18px;">⚡ Command Palette Shortcuts</h2>
      <button id="cmd-close" class="pill" style="width:auto; padding:4px 10px;">✕</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; font-size:14px;">
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>Go to Today</span><code>T</code></div>
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>Go to People / Crews</span><code>P</code></div>
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>Go to Map & Hotspots</span><code>M</code></div>
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>🎙️ VoiceOS Mic Capture</span><code>V</code></div>
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>🛡️ Start 45m Focus Shield</span><code>F</code></div>
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--line-soft); padding:6px 0;"><span>🧘 2-Min Mindfulness Reset</span><code>B</code></div>
    </div>
  </dialog>

  <div id="toast" hidden></div>

  <script src="sync_queue.js"></script>
  <script src="travel-coach.js"></script>
  <script src="travel-stats.js"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
